<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Music App</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; background: #121212; color: #fff; padding: 0 16px; }
    .nav { margin-bottom: 20px; display: flex; gap: 15px; }
    .nav a { color: #1db954; text-decoration: none; font-weight: bold; }
    .track { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid #282828; cursor: pointer; border-radius: 6px; }
    .track:hover { background: #1e1e1e; }
    input { padding: 10px; width: 70%; background: #282828; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 14px; }
    button { padding: 10px 18px; background: #1db954; border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 14px; }
    button:hover { background: #1ed760; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">Track Search</a> |
    <a href="/playlists.html">My Playlists (PKCE Login)</a>
  </div>

  <h2>Spotify Track Search</h2>
  <div style="display:flex; gap:10px; margin-bottom: 20px;">
    <input id="query" type="text" placeholder="Search songs or artists..." value="daft punk" />
    <button onclick="search()">Search</button>
  </div>

  <div id="player" style="margin: 20px 0;"></div>
  <div id="results"></div>

  <script>
    async function search() {
      const q = document.getElementById("query").value;
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const tracks = await res.json();

      if (tracks.error) {
        document.getElementById("results").innerHTML = `<p style="color:#ff5555">${tracks.error}: ${tracks.details || ''}</p>`;
        return;
      }

      document.getElementById("results").innerHTML = tracks.map(t => {
        const audioAttr = t.audio_url ? encodeURIComponent(t.audio_url) : '';
        return `
        <div class="track" onclick="playTrack('${t.id}', '${audioAttr}')">
          <img src="${t.album.images[2]?.url || t.album.images[0]?.url || ''}" width="50" height="50" style="border-radius:4px;" />
          <div>
            <strong>${t.name}</strong><br/>
            <small style="color:#aaa">${t.artists.map(a => a.name).join(", ")}</small>
          </div>
        </div>
      `}).join("");
    }

    function playTrack(trackId, audioUrlEncoded) {
      if (audioUrlEncoded) {
        const audioUrl = decodeURIComponent(audioUrlEncoded);
        document.getElementById("player").innerHTML = `
          <div style="background:#1e1e1e; padding:12px; border-radius:10px; margin-bottom:15px;">
            <audio controls autoplay style="width:100%;">
              <source src="${audioUrl}" type="audio/mpeg">
              Your browser does not support audio playback.
            </audio>
          </div>`;
      } else {
        document.getElementById("player").innerHTML = `
          <iframe style="border-radius:12px"
            src="https://open.spotify.com/embed/track/${trackId}?utm_source=generator"
            width="100%" height="152" frameBorder="0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
          </iframe>`;
      }
    }

    search();
  </script>
</body>
</html>
