<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Playlist Loader</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; background: #121212; color: #fff; padding: 0 16px; }
    .nav { margin-bottom: 20px; display: flex; gap: 15px; }
    .nav a { color: #1db954; text-decoration: none; font-weight: bold; }
    button { padding: 10px 18px; background: #1db954; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; color: #000; }
    button:hover { background: #1ed760; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #282828; cursor: pointer; border-radius: 4px; }
    .item:hover { background: #1e1e1e; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">Track Search</a> |
    <a href="/playlists.html">My Playlists (PKCE Login)</a>
  </div>

  <h2>My Spotify Playlists</h2>
  <button id="login-btn" onclick="redirectToSpotifyLogin()">Login with Spotify</button>
  <button id="logout-btn" onclick="logout()" style="display:none; background:#333; color:#fff;">Logout</button>
  <div id="player" style="margin-top: 20px;"></div>

  <div class="grid">
    <div>
      <h3>Playlists</h3>
      <div id="playlists"></div>
    </div>
    <div>
      <h3>Tracks</h3>
      <div id="tracks"></div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    let accessToken = null;

    async function init() {
      accessToken = await handleCallbackAndGetToken();
      if (accessToken) {
        document.getElementById("login-btn").style.display = "none";
        document.getElementById("logout-btn").style.display = "inline-block";
        loadUserPlaylists();
      }
    }

    function logout() {
      localStorage.removeItem("spotify_access_token");
      localStorage.removeItem("pkce_verifier");
      window.location.reload();
    }

    async function loadUserPlaylists() {
      const res = await fetch("https://api.spotify.com/v1/me/playlists?limit=20", {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const data = await res.json();
      if (!data.items) {
        document.getElementById("playlists").innerHTML = `<p style="color:#ff5555">${data.error?.message || 'Failed to load playlists'}</p>`;
        return;
      }

      document.getElementById("playlists").innerHTML = data.items.map(pl => `
        <div class="item" onclick="loadPlaylistTracks('${pl.id}')">
          <img src="${pl.images?.[0]?.url || ''}" width="50" height="50" style="border-radius:4px;" />
          <div>
            <strong>${pl.name}</strong><br/>
            <small style="color:#aaa">${pl.tracks?.total || 0} tracks</small>
          </div>
        </div>
      `).join("");
    }

    async function loadPlaylistTracks(playlistId) {
      // Use /items according to Spotify OpenAPI recommendation, with fallback
      let res = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/items?limit=30`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      if (res.status === 404) {
        res = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks?limit=30`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
      }
      const data = await res.json();
      const items = data.items || [];

      document.getElementById("tracks").innerHTML = items.map((item) => {
        const track = item.item || item.track;
        if (!track) return '';
        return `
          <div class="item" onclick="playTrack('${track.id}')">
            <img src="${track.album?.images?.[2]?.url || track.album?.images?.[0]?.url || ''}" width="40" height="40" style="border-radius:4px;" />
            <div>
              <strong>${track.name}</strong><br/>
              <small style="color:#aaa">${track.artists?.map(a => a.name).join(", ")}</small>
            </div>
          </div>
        `;
      }).join("");
    }

    function playTrack(trackId) {
      document.getElementById("player").innerHTML = `
        <iframe style="border-radius:12px"
          src="https://open.spotify.com/embed/track/${trackId}?utm_source=generator"
          width="100%" height="152" frameBorder="0"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
        </iframe>`;
    }

    init();
  </script>
</body>
</html>
